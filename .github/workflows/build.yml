name: Build

on:
  push:
    branches: [ dev ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Shoko.Companion/Shoko.Companion.csproj

      - name: Build
        run: dotnet build Shoko.Companion/Shoko.Companion.csproj -c Release --no-restore

      - name: Test
        run: dotnet test Shoko.Companion.Tests/Shoko.Companion.Tests.csproj -c Release

  publish:
    name: Publish (${{ matrix.rid }})
    needs: build-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file (${{ matrix.rid }})
        shell: bash
        run: >
          dotnet publish Shoko.Companion/Shoko.Companion.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Package (Windows)
        if: matrix.rid == 'win-x64'
        shell: bash
        run: iscc /DSourceDir="${{ github.workspace }}\publish" packaging/win/installer.iss

      - name: Package (Linux)
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: bash packaging/linux/build.sh ${{ matrix.rid }}

      - name: Package (macOS)
        if: matrix.rid == 'osx-arm64'
        shell: bash
        run: bash packaging/osx/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: shoko-companion-${{ matrix.rid }}
          path: |
            shoko-companion.Installer.exe
            shoko-companion-*.AppImage
            shoko-companion-*-*.dmg
          if-no-files-found: error
